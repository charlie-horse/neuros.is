<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="theme-color"
			content="#E9E7E2"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#151819"
			media="(prefers-color-scheme: dark)"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
			Every real route is prerendered and fully readable without JavaScript.
			Only the unknown-URL fallback (build/404.html, an SPA shell) needs JS to render.
			The rule below is a hook for hiding any JS-only 404 affordance when scripting is off;
			nothing visible is printed here, because this markup ships on every page.
		-->
		<noscript
			><style>
				.nojs-404 {
					display: none;
				}
			</style></noscript
		>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
